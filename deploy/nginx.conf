# Legacy host-based Nginx example: for Docker Compose use frontend/nginx.conf instead.
# The production compose bundles Nginx in its own container; DO NOT install both.
server {
    listen 18080;
    server_name 172.16.10.3;
    root /data_1/ai-nutritionist-h5/frontend/dist;
    index index.html;
    client_max_body_size 6m;

    location / { try_files $uri $uri/ /index.html; }
    location /private-media/ {
        internal;
        alias /data_1/ai-nutritionist-h5/data/media/;
        add_header Cache-Control 'private, no-store';
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
