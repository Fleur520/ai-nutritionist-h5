name: Build and test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: test_nutrition_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_test_password"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Backend tests with SQLite
        working-directory: backend
        env:
          APP_REPORTS_ENABLED: 'true'
        run: python -m pytest tests -q --junitxml=../test-results/sqlite.xml
      - name: Backend tests with MySQL 5.7
        working-directory: backend
        env:
          APP_REPORTS_ENABLED: 'true'
          TEST_DB_ENGINE: mysql
          TEST_MYSQL_DATABASE: test_nutrition_ci
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci_test_password
        run: python -m pytest tests -q --junitxml=../test-results/mysql.xml
      - name: Release and rollback tests
        run: |
          mkdir -p test-results
          python -m unittest discover -s deploy/tests -v > test-results/delivery.txt 2>&1
          cat test-results/delivery.txt
      - name: Frontend production build
        working-directory: frontend
        env:
          VITE_REPORTS_ENABLED: 'false'
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build both deployment images
        run: |
          docker build -t nutrition-api:ci backend
          docker build --build-arg VITE_REPORTS_ENABLED=false -t nutrition-web:ci frontend
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.sha }}
          path: test-results/
          retention-days: 14
